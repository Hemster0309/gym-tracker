<!DOCTYPE html>
<html>
<head>
    <title>Gym Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="top-bar">
    <span>Gym Progress Tracker</span>
    <label class="switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
    </label>
</div>


<div class="form">
    <label>Exercise:</label>
    <input id="exercise" type="text" placeholder="Bench Press">

    <label>Weight (lbs):</label>
    <input id="weight" type="number">

    <label>Reps:</label>
    <input id="reps" type="number">

    <button onclick="addSet()">Add Set</button>
</div>

<h3>Workout Log</h3>
<table id="logTable">
    <tr>
        <th>Date</th>
        <th>Exercise</th>
        <th>Weight</th>
        <th>Reps</th>
    </tr>
</table>

<script src="script.js"></script>
</body>
</html>
